version: "3.9"

services:
  chattingo-mysql:
    image: mysql:8.0
    container_name: chattingo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chattingo_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpassword
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    volumes:
      - chattingo_db_data:/var/lib/mysql
    networks:
      - chattingo-network

  chattingo-backend:
    build: ./backend
    container_name: chattingo-backend
    env_file:
      - ./backend/.env
    depends_on:
      chattingo-mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - chattingo-network

  chattingo_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chattingo_frontend
    ports:
      - "3000:80"
    depends_on:
      - chattingo-backend
    networks:
      - chattingo-network

volumes:
  chattingo_db_data:
networks:
  chattingo-network:
    driver: bridge
