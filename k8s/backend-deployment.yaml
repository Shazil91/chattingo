apiVersion: apps/v1
kind: Deployment
metadata:
  name: chattingo-backend
  namespace: chattingo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chattingo-backend
  template:
    metadata:
      labels:
        app: chattingo-backend
    spec:
      containers:
      - name: backend
        image: shazil91ali/chattingo-chattingo_backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        env:
        - name: SERVER_PORT
          value: "8080"

        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://chattingo-mysql:3306/chattingo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

        - name: SPRING_DATASOURCE_USERNAME
          value: admin

        - name: SPRING_DATASOURCE_PASSWORD
          value: adminpassword

        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update

        - name: SPRING_JPA_SHOW_SQL
          value: "true"

        - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
          value: org.hibernate.dialect.MySQL8Dialect

        - name: JWT_SECRET
          value: z9iomEpv/QtMfd2HTXnLzGt/7+R7I38m9k0T4L7GJa0=

        - name: CORS_ALLOWED_ORIGINS
          value: http://localhost:3000,http://127.0.0.1:3000

        - name: CORS_ALLOWED_METHODS
          value: GET,POST,PUT,DELETE,OPTIONS,PATCH

        - name: CORS_ALLOWED_HEADERS
          value: "*"